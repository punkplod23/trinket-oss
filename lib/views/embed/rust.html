{% extends "embed/base.html" %}

{% block title %}Rust{% endblock %}
{% block embed_lang %}rust{% endblock %}
{% block head_styles %}<link rel="stylesheet" href="{{ '/css/compiled.css' | cachePrefix }}">{% endblock %}

{% block embed_content %}
<link rel="stylesheet" href="{{ '/css/compiled.css' | cachePrefix }}">
<div class="compiled-editor">
  <div class="compiled-toolbar">
    <strong>Rust</strong>
    <button id="compiled-run" type="button">Run</button>
  </div>
  <textarea id="compiled-code" spellcheck="false">fn main() {
    println!("Hello, Rust!");
}
</textarea>
  <pre id="compiled-output" aria-live="polite"></pre>
</div>
{% endblock %}

{% block body_scripts %}
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script src="{{ '/js/embed/compiled.js' | cachePrefix }}"></script>
{% endblock %}
